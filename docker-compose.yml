name: channel-promo-bot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    image: channel-promo-bot:${VERSION:-latest}
    container_name: channel-promo-bot-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    networks:
      - channel-promo-bot-network

networks:
  channel-promo-bot-network:
    name: channel-promo-bot-network
