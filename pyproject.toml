[project]
name = "channel-promo-bot"
version = "1.0.0"
description = "Production-ready Telegram channel cross-promotion bot (互推): submit/review, optional OpenAI classify, scheduled promo broadcast, SQLite locks, health checks, systemd"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "tytsxai" },
]
keywords = [
    "telegram",
    "bot",
    "aiogram",
    "channel",
    "cross-promotion",
    "promo",
    "sqlite",
    "openai",
    "systemd",
    "channel-promo-bot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "aiogram>=3.4.1,<4.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "openai>=1.6.1,<2.0.0",
    "httpx>=0.26.0,<1.0.0",
]


[project.urls]
Homepage = "https://github.com/tytsxai/channel-promo-bot"
Repository = "https://github.com/tytsxai/channel-promo-bot"
Documentation = "https://github.com/tytsxai/channel-promo-bot#readme"
Issues = "https://github.com/tytsxai/channel-promo-bot/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4,<8.0.0",
    "pytest-asyncio>=0.23.3,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.6.9,<1.0.0",
]

[project.scripts]
channel-promo-bot = "main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = ["src", "src.handlers", "src.models", "src.services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=70"
