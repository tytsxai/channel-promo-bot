[project]
name = "channel-promo-bot"
version = "1.0.0"
description = "Telegram 频道互推机器人，支持频道提交、管理员审核、AI 自动分类和定时群发"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "tytsxai" },
]
keywords = ["telegram", "bot", "aiogram", "channel", "promotion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "aiogram>=3.4.1,<4.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "openai>=1.6.1,<2.0.0",
    "httpx>=0.26.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4,<8.0.0",
    "pytest-asyncio>=0.23.3,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.6.9,<1.0.0",
]

[project.scripts]
channel-promo-bot = "main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = ["src", "src.handlers", "src.models", "src.services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=70"
